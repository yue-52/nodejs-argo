<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>粒子环保 · 跟随鼠标变换</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a1f0a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: radial-gradient(circle at 30% 30%, #1a3a1a, #0a1a0a);
      cursor: crosshair;
      box-shadow: 0 0 40px rgba(60, 180, 60, 0.2);
    }
    .message {
      position: fixed;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(180, 230, 180, 0.6);
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-shadow: 0 0 15px #2d7a2d;
      pointer-events: none;
      backdrop-filter: blur(2px);
      padding: 10px 20px;
      background: rgba(10, 30, 10, 0.3);
      border-radius: 40px;
      width: fit-content;
      margin: 0 auto;
      border: 1px solid rgba(100, 200, 100, 0.15);
      font-weight: 400;
      z-index: 10;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    .message i {
      font-style: normal;
      display: inline-block;
      margin: 0 8px;
    }
    @media (max-width: 600px) {
      .message {
        font-size: 0.9rem;
        bottom: 18px;
        padding: 6px 18px;
        background: rgba(10, 30, 10, 0.5);
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="message">🌱 守护绿色 · 粒子随行 🌍</div>

  <script>
    (function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      let width, height;
      let particles = [];
      const PARTICLE_COUNT = 220;        // 粒子数量 —— 生机盎然
      const MAX_DIST = 130;             // 连线距离阈值
      const MOUSE_INFLUENCE = 0.12;     // 鼠标跟随柔和度

      // 鼠标 / 触摸 坐标 (归一化 0~1)
      let mouseX = 0.5;
      let mouseY = 0.5;
      let mouseActive = false;

      // 用于缓动跟随的“真实”目标点 (让鼠标移动更柔和)
      let targetX = 0.5;
      let targetY = 0.5;

      // ----- 工具：随机范围 -----
      const rand = (min, max) => Math.random() * (max - min) + min;

      // ----- 粒子类 -----
      class Particle {
        constructor() {
          this.reset(true); // 初始完全随机
        }

        reset(init = false) {
          // 位置 (0~1 归一化)
          this.x = rand(0, 1);
          this.y = rand(0, 1);
          // 尺寸: 基础半径 1.8~5.2，环保主题以绿色调大小略有层次
          this.baseRadius = rand(1.8, 5.2);
          // 颜色: 从嫩绿到深绿，带一点青/黄
          const hue = rand(95, 155);        // 95~155 绿色范围 (黄绿→青绿)
          const sat = rand(50, 85);
          const lig = rand(55, 85);
          this.color = `hsl(${hue}, ${sat}%, ${lig}%)`;
          // 独立速度 (用于随机漫游，让粒子有呼吸感)
          this.vx = rand(-0.0006, 0.0006);
          this.vy = rand(-0.0006, 0.0006);
          // 相位偏移 (用于微动)
          this.phase = rand(0, Math.PI * 2);
          // 标记是否初始化 (重置时稍微偏移)
          if (!init) {
            // 非初始化重置：在当前位置附近扰动，避免完全重叠
            this.x += rand(-0.05, 0.05);
            this.y += rand(-0.05, 0.05);
            // 边界修剪
            this.x = Math.min(1, Math.max(0, this.x));
            this.y = Math.min(1, Math.max(0, this.y));
          }
        }

        // 更新粒子位置：结合随机漫游 + 鼠标吸引
        update(time) {
          // 1. 随机漫游 (布朗运动，幅度随环境柔和)
          this.vx += rand(-0.0004, 0.0004);
          this.vy += rand(-0.0004, 0.0004);
          // 限制速度幅度
          const maxSpeed = 0.002;
          let sp = Math.hypot(this.vx, this.vy);
          if (sp > maxSpeed) {
            this.vx = (this.vx / sp) * maxSpeed;
            this.vy = (this.vy / sp) * maxSpeed;
          }

          // 2. 鼠标影响：朝鼠标位置偏移 (归一化坐标)
          const dx = mouseX - this.x;
          const dy = mouseY - this.y;
          const dist = Math.hypot(dx, dy);
          // 距离越近，吸引力越强 (但不会过于聚集)
          if (dist > 0.001) {
            const force = Math.min(0.035, MOUSE_INFLUENCE * 0.8 / (dist + 0.05));
            this.vx += dx * force;
            this.vy += dy * force;
          }

          // 3. 边界反弹/回推 (让粒子不超出画布)
          const margin = 0.02;
          if (this.x < margin) { this.x = margin; this.vx += 0.002; }
          if (this.x > 1 - margin) { this.x = 1 - margin; this.vx -= 0.002; }
          if (this.y < margin) { this.y = margin; this.vy += 0.002; }
          if (this.y > 1 - margin) { this.y = 1 - margin; this.vy -= 0.002; }

          // 4. 应用速度
          this.x += this.vx;
          this.y += this.vy;

          // 5. 微弱的“呼吸”漂移 (基于时间正弦)
          const breathe = 0.0002 * Math.sin(time * 0.002 + this.phase);
          this.x += breathe * 0.5;
          this.y += breathe * 0.3;

          // 裁剪到 [0,1]
          this.x = Math.min(1, Math.max(0, this.x));
          this.y = Math.min(1, Math.max(0, this.y));
        }

        // 绘制粒子 (光晕 + 核心)
        draw(ctx, width, height) {
          const px = this.x * width;
          const py = this.y * height;
          const radius = this.baseRadius * (0.8 + 0.4 * Math.sin(Date.now() * 0.003 + this.phase));

          // 发光外晕 (环保绿光)
          const gradient = ctx.createRadialGradient(px, py, 0, px, py, radius * 2.6);
          gradient.addColorStop(0, this.color);
          gradient.addColorStop(0.4, this.color.replace('hsl', 'hsla').replace(')', ', 0.5)'));
          gradient.addColorStop(1, 'rgba(40, 100, 40, 0)');
          ctx.beginPath();
          ctx.arc(px, py, radius * 2.6, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();

          // 核心亮点
          ctx.beginPath();
          ctx.arc(px, py, radius * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = 'rgba(120, 255, 120, 0.5)';
          ctx.shadowBlur = 16;
          ctx.fill();
          // 高光小点
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(px - radius * 0.2, py - radius * 0.25, radius * 0.25, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(240, 255, 220, 0.7)';
          ctx.fill();
          // 重置阴影
          ctx.shadowBlur = 0;
        }
      }

      // ----- 初始化粒子 -----
      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }

      // ----- 绘制连线 (生态网络) -----
      function drawConnections(ctx, width, height) {
        const len = particles.length;
        // 为了性能，随机采样部分配对，但仍保持丰富连线
        const step = 2; // 每隔一个粒子检查，提高性能
        for (let i = 0; i < len; i += step) {
          const p1 = particles[i];
          const px1 = p1.x * width;
          const py1 = p1.y * height;

          // 只与附近的粒子连线 (从 i+1 开始)
          for (let j = i + 1; j < len; j += 2) {
            const p2 = particles[j];
            const dx = px1 - p2.x * width;
            const dy = py1 - p2.y * height;
            const dist = Math.hypot(dx, dy);
            if (dist < MAX_DIST) {
              // 透明度随距离变化
              const alpha = 1 - (dist / MAX_DIST);
              const lineWidth = 0.8 + alpha * 1.5;
              // 颜色：青绿到翠绿，且受鼠标距离影响 (鼠标附近更亮)
              const green = 140 + 80 * alpha;
              const blue = 70 + 60 * alpha;
              // 鼠标距离影响亮度：计算粒子到鼠标的归一化距离
              const mx = mouseX * width;
              const my = mouseY * height;
              const distToMouse = Math.hypot(px1 - mx, py1 - my);
              const mouseBright = Math.max(0.4, 1 - distToMouse / (width * 0.5));
              const finalAlpha = alpha * (0.35 + 0.55 * mouseBright);

              ctx.beginPath();
              ctx.moveTo(px1, py1);
              ctx.lineTo(p2.x * width, p2.y * height);
              ctx.strokeStyle = `rgba(120, ${Math.floor(green)}, ${Math.floor(blue)}, ${finalAlpha * 0.7})`;
              ctx.lineWidth = lineWidth * 0.8;
              ctx.shadowColor = 'rgba(100, 200, 100, 0.2)';
              ctx.shadowBlur = 8;
              ctx.stroke();
            }
          }
        }
        ctx.shadowBlur = 0;
      }

      // ----- 重置画布尺寸 -----
      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        // 尺寸变化时重新分布粒子，避免聚集
        if (particles.length) {
          particles.forEach(p => {
            p.x = rand(0, 1);
            p.y = rand(0, 1);
          });
        }
      }

      // ----- 动画循环 -----
      let animationFrame;
      function animate(timestamp) {
        // 更新粒子
        for (let p of particles) {
          p.update(timestamp);
        }

        // 清空画布 (半透明拖尾效果)
        ctx.clearRect(0, 0, width, height);
        // 绘制朦胧背景光晕 (微弱的环保色)
        const bgGrad = ctx.createRadialGradient(
          width * mouseX, height * mouseY, 10,
          width * mouseX, height * mouseY, width * 0.7
        );
        bgGrad.addColorStop(0, 'rgba(40, 100, 40, 0.08)');
        bgGrad.addColorStop(0.5, 'rgba(20, 70, 20, 0.04)');
        bgGrad.addColorStop(1, 'rgba(0, 20, 0, 0)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        // 绘制连线 (先画连线再画粒子，使粒子在上层)
        drawConnections(ctx, width, height);

        // 绘制粒子
        for (let p of particles) {
          p.draw(ctx, width, height);
        }

        // 添加一些漂浮的“孢子”小点 (额外装饰)
        ctx.shadowBlur = 0;
        for (let i = 0; i < 6; i++) {
          const t = timestamp * 0.0004 + i * 1.8;
          const x = (Math.sin(t) * 0.5 + 0.5) * width;
          const y = (Math.cos(t * 0.7) * 0.5 + 0.5) * height;
          const r = 1.5 + Math.sin(t * 2) * 0.8;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(160, 230, 150, ${0.12 + 0.08 * Math.sin(t * 1.3)})`;
          ctx.fill();
        }

        animationFrame = requestAnimationFrame(animate);
      }

      // ----- 鼠标 / 触摸 事件 (归一化坐标) -----
      function handleMove(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches) {
          // 触摸事件
          e.preventDefault();
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }
        // 计算归一化坐标 (0~1)
        let nx = (clientX - rect.left) / rect.width;
        let ny = (clientY - rect.top) / rect.height;
        // 钳制
        nx = Math.min(1, Math.max(0, nx));
        ny = Math.min(1, Math.max(0, ny));
        mouseX = nx;
        mouseY = ny;
        mouseActive = true;
      }

      function handleLeave() {
        // 鼠标离开窗口时，慢慢回到中心，但不是立即跳转
        mouseActive = false;
        // 逐渐回到中心 (由动画循环处理)
      }

      // 使用 requestAnimationFrame 做平滑鼠标归位
      function smoothMouseReturn() {
        if (!mouseActive) {
          // 每帧向中心靠近
          mouseX += (0.5 - mouseX) * 0.02;
          mouseY += (0.5 - mouseY) * 0.02;
        }
      }

      // 将鼠标归位逻辑注入动画循环 (通过修改animate)
      const originalAnimate = animate;
      animate = function(timestamp) {
        smoothMouseReturn();
        // 调用原函数逻辑 (但没法直接覆盖，重新定义)
        // 这里重新实现一遍以保证清晰
        // 更新粒子
        for (let p of particles) {
          p.update(timestamp);
        }

        ctx.clearRect(0, 0, width, height);
        // 背景光晕
        const bgGrad = ctx.createRadialGradient(
          width * mouseX, height * mouseY, 10,
          width * mouseX, height * mouseY, width * 0.7
        );
        bgGrad.addColorStop(0, 'rgba(40, 100, 40, 0.08)');
        bgGrad.addColorStop(0.5, 'rgba(20, 70, 20, 0.04)');
        bgGrad.addColorStop(1, 'rgba(0, 20, 0, 0)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        drawConnections(ctx, width, height);

        for (let p of particles) {
          p.draw(ctx, width, height);
        }

        // 孢子
        ctx.shadowBlur = 0;
        for (let i = 0; i < 6; i++) {
          const t = timestamp * 0.0004 + i * 1.8;
          const x = (Math.sin(t) * 0.5 + 0.5) * width;
          const y = (Math.cos(t * 0.7) * 0.5 + 0.5) * height;
          const r = 1.5 + Math.sin(t * 2) * 0.8;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(160, 230, 150, ${0.12 + 0.08 * Math.sin(t * 1.3)})`;
          ctx.fill();
        }

        animationFrame = requestAnimationFrame(animate);
      };

      // ----- 启动与事件绑定 -----
      function init() {
        resizeCanvas();
        initParticles();

        // 鼠标事件
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseleave', handleLeave);
        // 触摸事件
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', () => { mouseActive = false; });
        window.addEventListener('touchcancel', () => { mouseActive = false; });

        // 窗口缩放重置
        window.addEventListener('resize', () => {
          resizeCanvas();
        });

        // 启动动画
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animate(0);
      }

      // 页面加载初始化
      if (document.readyState === 'complete') {
        init();
      } else {
        window.addEventListener('load', init);
      }

    })();
  </script>
</body>
</html>
