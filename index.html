<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>粒子 · 保护环境</title>
    <style>
        /* 全局重置，简约风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1f1a;  /* 深林底色 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 画布容器 — 粒子背景层 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;  /* 让交互穿透 */
        }

        /* 主内容卡片 — 简约精美，毛玻璃效果 */
        .hero {
            position: relative;
            z-index: 10;
            max-width: 720px;
            width: 90%;
            padding: 2.8rem 2.5rem;
            background: rgba(220, 245, 235, 0.15);
            backdrop-filter: blur(8px) saturate(1.2);
            -webkit-backdrop-filter: blur(8px) saturate(1.2);
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0, 20, 10, 0.5), 0 0 0 1px rgba(180, 230, 200, 0.2);
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(160, 220, 190, 0.25);
            color: #e3f5ed;
            text-shadow: 0 2px 6px rgba(0, 20, 10, 0.5);
        }

        /* 装饰微光 */
        .hero::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 30% 40%, rgba(130, 220, 180, 0.08), transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        /* 标题 — 清新自然 */
        .hero h1 {
            font-size: 3.4rem;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 0.4rem;
            background: linear-gradient(145deg, #d4f5e8, #b0e0c0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(90, 200, 150, 0.3);
            word-break: break-word;
        }

        .hero .sub {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #c3e8d8;
            margin-top: -0.2rem;
            margin-bottom: 1.8rem;
            opacity: 0.9;
            text-transform: uppercase;
        }

        /* 分隔线 — 自然元素 */
        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8dcdb0, transparent);
            margin: 0.8rem auto 1.8rem auto;
            border-radius: 4px;
        }

        /* 描述文字 */
        .hero p {
            font-size: 1.15rem;
            line-height: 1.7;
            font-weight: 300;
            max-width: 500px;
            margin: 0 auto 2rem auto;
            color: #ddf3ea;
            background: rgba(0, 30, 20, 0.2);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(140, 210, 180, 0.15);
        }

        /* 按钮 — 简约精致 */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem;
        }

        .btn {
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 2px;
            background: transparent;
            border: 1px solid rgba(180, 230, 200, 0.5);
            color: #daf5e8;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 12px rgba(0, 20, 10, 0.2);
            text-decoration: none;
            display: inline-block;
            background: rgba(40, 80, 60, 0.2);
            min-width: 140px;
        }

        .btn-primary {
            background: rgba(100, 210, 160, 0.25);
            border-color: #7acbad;
            color: #f0fcf6;
            box-shadow: 0 0 20px rgba(80, 200, 150, 0.2);
        }

        .btn-primary:hover {
            background: rgba(120, 220, 180, 0.35);
            border-color: #9edfc0;
            box-shadow: 0 0 30px rgba(80, 220, 160, 0.3);
            transform: scale(1.02);
        }

        .btn-outline:hover {
            background: rgba(160, 210, 185, 0.15);
            border-color: #b5dfc8;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* 小叶子装饰 (纯CSS) */
        .leaf-icon {
            display: inline-block;
            margin-right: 10px;
            font-size: 1.3rem;
            filter: drop-shadow(0 0 8px rgba(100, 200, 150, 0.3));
            vertical-align: middle;
        }

        /* 响应式 */
        @media (max-width: 500px) {
            .hero {
                padding: 2rem 1.2rem;
                border-radius: 32px;
            }
            .hero h1 {
                font-size: 2.6rem;
                letter-spacing: 2px;
            }
            .hero .sub {
                font-size: 0.9rem;
                letter-spacing: 4px;
            }
            .hero p {
                font-size: 1rem;
                padding: 0.4rem 0.8rem;
            }
            .btn {
                padding: 0.6rem 1.4rem;
                min-width: 120px;
                font-size: 0.9rem;
            }
        }

        /* 底部水印 — 极简 */
        .credit {
            position: fixed;
            bottom: 24px;
            right: 28px;
            z-index: 20;
            color: rgba(180, 220, 200, 0.25);
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: 300;
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 20, 10, 0.15);
            border: 1px solid rgba(120, 180, 150, 0.08);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 粒子画布 -->
    <canvas id="particle-canvas"></canvas>

    <!-- 主界面 -->
    <main class="hero">
        <h1>🌱 共生</h1>
        <div class="sub">保护 · 永续</div>
        <div class="divider"></div>
        <p>✨ 每一颗微尘，都是自然的呼吸。<br>守护绿色，即是守护未来。</p>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="alert('🌍 愿每一缕风都清澈，每一片叶都自由。')">
                <span class="leaf-icon">🌿</span> 行动
            </button>
            <button class="btn btn-outline" onclick="alert('🌳 万物有灵，和谐共生。')">
                <span class="leaf-icon">🍃</span> 永续
            </button>
        </div>
    </main>

    <div class="credit">✦ 粒子 · 自然 ✦</div>

    <script>
        (function() {
            "use strict";

            // ----- 画布设置 -----
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 120;        // 粒子数量 (恰到好处的密度)
            const MAX_SPEED = 0.35;            // 柔和飘动

            // 颜色调色板 — 自然绿意 + 微光
            const palette = [
                { r: 140, g: 220, b: 170 },   // 嫩绿
                { r: 110, g: 200, b: 160 },   // 草绿
                { r: 180, g: 235, b: 190 },   // 浅薄荷
                { r: 90,  g: 190, b: 150 },   // 森林
                { r: 210, g: 240, b: 200 },   // 淡青
                { r: 160, g: 210, b: 180 },   // 灰绿
            ];

            // 辅助: 随机范围
            const rand = (min, max) => Math.random() * (max - min) + min;

            // ----- 粒子类 -----
            class Particle {
                constructor() {
                    this.reset(true); // 强制初始随机位置
                    // 额外随机尺寸 & 透明度 & 颜色偏移
                    this.size = rand(2.8, 6.0);
                    this.opacity = rand(0.4, 0.9);
                    // 从调色板中选一个基色
                    const col = palette[Math.floor(Math.random() * palette.length)];
                    this.color = {
                        r: col.r + Math.floor(rand(-18, 18)),
                        g: col.g + Math.floor(rand(-18, 18)),
                        b: col.b + Math.floor(rand(-18, 18)),
                    };
                    // 确保颜色在合理范围
                    this.color.r = Math.min(255, Math.max(80, this.color.r));
                    this.color.g = Math.min(240, Math.max(100, this.color.g));
                    this.color.b = Math.min(220, Math.max(90, this.color.b));

                    // 速度 (极慢飘动)
                    this.vx = rand(-MAX_SPEED, MAX_SPEED);
                    this.vy = rand(-MAX_SPEED, MAX_SPEED);
                    // 轻微旋转变化因子 (用于轨迹)
                    this.phase = rand(0, Math.PI * 2);
                    this.drift = rand(0.002, 0.008);
                }

                reset(forceRandom = false) {
                    if (forceRandom || Math.random() < 0.3) {
                        // 完全随机
                        this.x = rand(0, width);
                        this.y = rand(0, height);
                    } else {
                        // 略微偏向中心区域 (让视觉聚焦)
                        const cx = width * 0.5, cy = height * 0.45;
                        this.x = cx + rand(-width * 0.4, width * 0.4);
                        this.y = cy + rand(-height * 0.35, height * 0.35);
                        // 边界保护
                        this.x = Math.min(width, Math.max(0, this.x));
                        this.y = Math.min(height, Math.max(0, this.y));
                    }
                    // 随机速度微调
                    this.vx = rand(-MAX_SPEED, MAX_SPEED);
                    this.vy = rand(-MAX_SPEED, MAX_SPEED);
                }

                // 更新位置 & 边界回弹 / 柔和环绕
                update() {
                    // 加入正弦微扰，产生更自然的流动感
                    this.phase += this.drift;
                    const waveX = Math.sin(this.phase) * 0.08;
                    const waveY = Math.cos(this.phase * 0.7) * 0.08;

                    this.x += this.vx + waveX;
                    this.y += this.vy + waveY;

                    // 边界处理 — 柔和循环 (像在广袤森林中飘移)
                    if (this.x < -20) this.x = width + 20;
                    else if (this.x > width + 20) this.x = -20;
                    if (this.y < -20) this.y = height + 20;
                    else if (this.y > height + 20) this.y = -20;

                    // 偶尔轻微改变方向 (增加随机性)
                    if (Math.random() < 0.006) {
                        this.vx += rand(-0.08, 0.08);
                        this.vy += rand(-0.08, 0.08);
                        // 限速
                        const maxV = MAX_SPEED * 1.2;
                        this.vx = Math.min(maxV, Math.max(-maxV, this.vx));
                        this.vy = Math.min(maxV, Math.max(-maxV, this.vy));
                    }
                }

                // 绘制粒子 (带光晕)
                draw(ctx) {
                    const { r, g, b } = this.color;
                    const alpha = this.opacity * (0.7 + 0.3 * Math.sin(this.phase * 0.5)); // 呼吸感

                    // 主光晕 (外发光)
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.size * 2.8
                    );
                    gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.7})`);
                    gradient.addColorStop(0.5, `rgba(${r-20}, ${g+10}, ${b-10}, ${alpha * 0.25})`);
                    gradient.addColorStop(1, `rgba(${r-40}, ${g-20}, ${b-20}, 0)`);

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.8, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // 核心亮点 (更明亮)
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.7, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${Math.min(255, r+40)}, ${Math.min(255, g+40)}, ${Math.min(255, b+30)}, ${alpha * 0.8})`;
                    ctx.fill();

                    // 第二层光晕 (小)
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.2})`;
                    ctx.fill();

                    // 微光连接线 (极淡) — 与临近粒子互动，但为了简约，只加一点装饰
                    // 在draw中不做连线，避免杂乱
                }
            }

            // ----- 初始化粒子 -----
            function initParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push(new Particle());
                }
            }

            // ----- 调整尺寸 (自适应) -----
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                // 粒子重置位置适应新尺寸 (保留部分位置)
                if (particles.length > 0) {
                    particles.forEach(p => {
                        p.x = Math.min(width, Math.max(0, p.x));
                        p.y = Math.min(height, Math.max(0, p.y));
                    });
                } else {
                    initParticles();
                }
            }

            // ----- 绘制背景 (极简渐变) -----
            function drawBackground() {
                // 深邃林间底色，带有微光渐变
                const gradient = ctx.createLinearGradient(0, 0, width * 0.6, height);
                gradient.addColorStop(0, '#0a2820');
                gradient.addColorStop(0.5, '#11352a');
                gradient.addColorStop(1, '#0b1f1a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);

                // 添加非常淡的雾状光晕 (提升层次)
                const glow = ctx.createRadialGradient(
                    width * 0.4, height * 0.3, 0,
                    width * 0.4, height * 0.3, width * 0.6
                );
                glow.addColorStop(0, 'rgba(80, 180, 140, 0.04)');
                glow.addColorStop(0.7, 'rgba(40, 130, 100, 0.02)');
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, width, height);
            }

            // ----- 画连接线 (非常淡，增强粒子之间的“生态网络”感) -----
            function drawConnections() {
                // 只连接距离较近的粒子，表现“共生”主题
                const maxDist = 120;
                const maxDistSq = maxDist * maxDist;
                const len = particles.length;

                // 为了性能，只对部分粒子进行连接 (随机采样，依然保持视觉效果)
                const step = 2; 
                for (let i = 0; i < len; i += step) {
                    const p1 = particles[i];
                    for (let j = i + 1; j < len; j += step) {
                        const p2 = particles[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq < maxDistSq && distSq > 5) {
                            const dist = Math.sqrt(distSq);
                            const alpha = 0.15 * (1 - dist / maxDist) * 0.6;
                            // 颜色从两个粒子取平均
                            const r = (p1.color.r + p2.color.r) / 2;
                            const g = (p1.color.g + p2.color.g) / 2;
                            const b = (p1.color.b + p2.color.b) / 2;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
            }

            // ----- 动画循环 -----
            function animate() {
                // 1. 背景
                drawBackground();

                // 2. 更新粒子
                for (let p of particles) {
                    p.update();
                }

                // 3. 画连接 (生态网)
                drawConnections();

                // 4. 绘制粒子 (叠加)
                for (let p of particles) {
                    p.draw(ctx);
                }

                // 额外装饰: 极少量星芒 (漂浮的亮点)
                if (particles.length > 0) {
                    for (let i = 0; i < 4; i++) {
                        const idx = Math.floor(Math.random() * particles.length);
                        const p = particles[idx];
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(220, 255, 230, 0.25)`;
                        ctx.fill();
                    }
                }

                requestAnimationFrame(animate);
            }

            // ----- 启动一切 -----
            function init() {
                resizeCanvas();
                initParticles();
                animate();

                // 窗口变化自适应
                window.addEventListener('resize', () => {
                    resizeCanvas();
                });

                // 对于移动端，不需要额外操作
            }

            // 页面完全加载后执行
            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }

        })();
    </script>
</body>
</html>
